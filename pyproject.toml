[project]
name = "envault"
version = "1.2.0"
description = "Encrypt and decrypt .env files with AES-256-GCM"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0",
]

[project.scripts]
envault = "envault:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
